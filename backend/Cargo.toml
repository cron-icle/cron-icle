[package]
name = "chronicled"
version = "0.1.0"
description = "Chronicle local-first computer memory engine daemon"
authors = ["Chronicle"]
edition = "2021"

[[bin]]
name = "chronicle"
path = "src/main.rs"

[lib]
name = "chronicled"
crate-type = ["rlib"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
notify = "8.2.0"
open = "5"
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35", features = ["bundled"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1.9"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "macros", "signal", "process"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61", features = ["Graphics_Capture", "Graphics_DirectX_Direct3D11", "UI", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_WinRT_Direct3D11", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
rfd = "0.17.2"
llama-cpp-rs = { path = "../../llama-cpp-rs/llama-cpp-rs", version = "0.1.0", features = ["mtmd"] }
encoding_rs = "0.8.35"
mime_guess = "2"

[target."cfg(not(windows))".dependencies]
active-win-pos-rs = "0.11.0"
rdev = "0.5.3"
xcap = "0.9.8"
