[package]
name = "chronicle"
version = "0.1.0"
description = "Chronicle local-first computer memory engine"
authors = ["Chronicle"]
edition = "2021"

[lib]
name = "chronicle_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
notify = "8.2.0"
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35", features = ["bundled"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1.9"
tauri = { version = "2.5", features = [] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.61", features = ["Graphics_Capture", "Graphics_DirectX_Direct3D11", "UI", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
rfd = "0.17.2"
llama-cpp-2 = "0.1.154"
encoding_rs = "0.8.35"
